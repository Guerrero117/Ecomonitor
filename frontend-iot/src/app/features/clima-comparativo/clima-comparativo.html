<div class="main-content">
  <section class="science-board-top">
    <span class="board-tag">ANÁLISIS TÉRMICO</span>
    <div class="board-content">
      <p>Comparativa en tiempo real: Sensor Local vs. Estación Meteorológica Exterior.</p>
    </div>
  </section>

  <div class="dashboard-grid">
    <div class="glass-card">
      <div class="sensor-header">
        <span class="sensor-icon">🌍</span>
        <span class="sensor-status">Exterior</span>
      </div>
      <h3>{{ tempExterior }}°C</h3>
      <p class="sensor-type">OpenWeather API</p>
    </div>

    <div class="glass-card">
      <div class="sensor-header">
        <span class="sensor-icon">🏠</span>
        <span class="sensor-status" style="color: #10b981">Interior</span>
      </div>
      <h3>{{ tempInterior }}°C</h3>
      <p class="sensor-type">Sensor EcoMonitor</p>
    </div>

    <div class="glass-card" [style.background]="diferencia > 5 ? 'rgba(245, 158, 11, 0.1)' : ''">
      <div class="sensor-header">
        <span class="sensor-icon">📊</span>
        <span class="sensor-status">Diferencia</span>
      </div>
      <h3 [style.color]="diferencia > 5 ? '#f59e0b' : '#10b981'">
        {{ diferencia.toFixed(1) }}°C
      </h3>
      <p class="sensor-type">Brecha Térmica</p>
    </div>
  </div>
</div>
