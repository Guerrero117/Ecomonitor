<div class="rpassword-container">
  <div class="rpassword-card">
    <h2>🌱 Recuperar contraseña</h2>
    <p>Ingresa tu correo electrónico para enviarte instrucciones.</p>
    <label for="correo">Correo electrónico</label>
    <input
      id="correo"
      type="email"
      placeholder="usuario@correo.com"
      [(ngModel)]="correo"
    />
    <button type="button" class="btn-send" (click)="enviarRecuperacion()">
  Enviar
</button>

    <button type="button" class="btn-back" (click)="volverLogin()">
        Volver al login
    </button>
  </div>
</div>
