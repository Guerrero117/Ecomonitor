<div class="main-content fade-in">
  <section class="science-board-top">
    <div class="board-header">
      <span class="board-tag">SISTEMA ECO-MONITOR</span>
      <span class="live-indicator"><span class="dot"></span> Gestión Activa</span>
    </div>
    <div class="board-content">
      <p>Gestión técnica de dispositivos y captura manual de métricas ambientales.</p>
    </div>
  </section>

  <div class="glass-card group-filter-card">
    <div class="form-group">
      <label>FILTRAR POR GRUPO / ÁREA</label>
      <select [(ngModel)]="grupoId" class="custom-select-pro" (change)="onGrupoChange()">
        <option value="">-- Ver todos los sensores --</option>
        <option *ngFor="let g of listaGrupos" [value]="g.id || g._id">{{ g.nombre }}</option>
      </select>
    </div>
  </div>

  <div class="glass-card manual-input-card" style="margin-top: 20px;">
    <h4 class="section-title-neon">Registrar Hardware</h4>
    <form (ngSubmit)="registrarNuevoSensor()" class="manual-form-horizontal">
      
      <div class="form-group">
        <label>IDENTIFICADOR DEL NODO</label>
        <input type="text" [(ngModel)]="nuevoSensor.nombre" name="nombreNodo" placeholder="Ej: Sensor Patio Trasero" required>
      </div>

      <div class="form-group">
        <label>MODELO DE HARDWARE</label>
        <select [(ngModel)]="nuevoSensor.tipo" name="modeloHardware" class="custom-select-pro" (change)="actualizarUnidadNuevoSensor()" required>
          <option value="" disabled selected>Selecciona un modelo...</option>
          <option value="MQ-135 / FC-22 (Calidad Aire)">MQ-135 / FC-22 (Calidad Aire)</option>
          <option value="LDR / Fotocelda (Luminosidad)">LDR / Fotocelda (Luminosidad)</option>
          <option value="DHT-11 (Humedad)">DHT-11 (Humedad)</option>
          <option value="LM35 (Temperatura)">LM35 (Temperatura)</option>
        </select>
      </div>

      <div class="form-group" style="flex: 0.4;">
        <label>FRECUENCIA (SEG)</label>
        <input type="number" [(ngModel)]="nuevoSensor.frecuencia" name="frecuencia" placeholder="10">
      </div>

      <div class="form-group" style="flex: 0.4;">
        <label>UNIDAD</label>
        <input type="text" [value]="nuevoSensor.unidad" disabled class="disabled-input">
      </div>

      <div class="form-group button-group">
        <button type="submit" class="btn-confirmar-neon" [disabled]="!nuevoSensor.nombre || !nuevoSensor.tipo">
          CONFIRMAR REGISTRO
        </button>
      </div>
    </form>
  </div>

  <div class="glass-card manual-input-card" style="margin-top: 25px;">
    <h4 class="section-title-neon">Capturar Valor Manual</h4>
    <form (ngSubmit)="guardarDato()" class="manual-form-horizontal">
      <div class="form-group" style="flex: 1.5;">
        <label>SELECCIONAR DISPOSITIVO</label>
        <select [(ngModel)]="lectura.sensorId" name="sensorId" class="custom-select-pro" (change)="onSensorChange()">
          <option value="" disabled selected>Elegir dispositivo...</option>
          <option *ngFor="let s of sensoresFiltrados" [value]="s.id || s._id">
            {{ s.nombre }} — {{ s.tipo }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label>VALOR ACTUAL</label>
        <div class="input-with-unit">
          <input type="number" [(ngModel)]="lectura.valor" name="valor" placeholder="0.00">
          <span class="unit-badge">{{ lectura.unidad || '--' }}</span>
        </div>
      </div>

      <div class="form-group button-group">
        <button type="submit" class="btn-confirmar-neon" [disabled]="!lectura.sensorId || lectura.valor === null">
          GUARDAR REGISTRO
        </button>
      </div>
    </form>
  </div>
</div>
