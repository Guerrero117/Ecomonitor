<div class="register-container">

  <div class="register-card">

    <h2 class="title">EcoMonitor</h2>
    <p class="subtitle">Crear cuenta</p>

     <form formGroup="registerForm" (ngSubmit)="register()">

      <label>Nombre</label>
      <input type="text" formControlName="name" placeholder="Tu nombre">

      <label>Correo electrónico</label>
      <input type="email" formControlName="email" placeholder="usuario@correo.com">

      <label>Contraseña</label>
      <input type="password" formControlName="password" placeholder="********">

      <label>Confirmar contraseña</label>
      <input type="password" formControlName="confirmPassword" placeholder="********">

      <button class="btn-enter" type="submit">
        Registrarse
      </button>

      <button class="btn-login" type="button" (click)="goLogin()">
        Login
      </button>

    </form>

  </div>

</div>
