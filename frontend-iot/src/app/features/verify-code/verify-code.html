<div class="code-container">
  <div class="code-card">
    <h2>🌱 Verificar código</h2>
    <p>Ingresa el código enviado a tu correo.</p>

    <label for="codigo">Código</label>
    
    <input id="codigo" type="text" maxlength="6" placeholder="123456" [(ngModel)]="codigo"/>

    <button type="button" class="btn-next" (click)="validarCodigo()">
      Continuar
    </button>

    <button type="button" class="btn-back" (click)="volverRecuperacion()">
      Volver
    </button>
  </div>
</div>
