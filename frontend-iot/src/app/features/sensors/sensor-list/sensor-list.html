<div class="sensors-container fade-in">
  <header class="page-header card-glass">
    <div class="header-info">
      <h1><i class="fas fa-microchip"></i> Gestión de Sensores</h1>
      <p>Configura tus nodos de telemetría en tiempo real.</p>
    </div>
    <button class="btn-add-sensor" (click)="abrirModal()">
      <i class="fas fa-plus-circle"></i> Nuevo Sensor
    </button>
  </header>

  

  <div class="grid-table card-glass">
    <table class="sensor-table">
      <thead>
        <tr>
          <th>Estado</th>
          <th>Nombre</th>
          <th>Tipo</th>
          <th>Frecuencia</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let sensor of sensors" class="row-hover">
          <td>
            <div class="status-indicator">
              <span [class]="sensor.estado ? 'dot online' : 'dot offline'"></span>
              {{ sensor.estado ? 'En línea' : 'Desconectado' }}
            </div>
          </td>
          <td><strong>{{ sensor.nombre }}</strong></td>
          <td><span class="badge-tipo"><i [class]="getIcon(sensor.tipo)"></i> {{ sensor.tipo }}</span></td>
          <td>{{ sensor.frecuencia }}s</td>
          <td>
            <button class="btn-icon delete" (click)="borrarSensor(sensor.id || sensor._id)">
              <i class="fas fa-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="modal-overlay" *ngIf="mostrarModal">
    <div class="modal-card card-glass">
      <div class="modal-header">
        <h3><i class="fas fa-plus"></i> Registrar Sensor</h3>
        <button class="close-x" (click)="cerrarModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="input-group">
          <label>Nombre del Nodo</label>
          <input type="text" [(ngModel)]="nuevoSensor.nombre" placeholder="Ej. ESP32-Invernadero" class="custom-input">
        </div>
        <div class="input-group">
          <label>Magnitud</label>
          <select [(ngModel)]="nuevoSensor.tipo" class="custom-select-box">
            <option value="Temperatura">Temperatura</option>
            <option value="Humedad">Humedad</option>
            <option value="Radiación UV">Radiación UV</option>
            <option value="CO2">CO2</option>
          </select>
        </div>
        <div class="input-group">
          <label>Frecuencia (segundos)</label>
          <input type="number" [(ngModel)]="nuevoSensor.frecuencia" class="custom-input">
        </div>
        <button class="btn-save" (click)="guardarSensor()" [disabled]="cargando">
          <i class="fas" [ngClass]="cargando ? 'fa-circle-notch fa-spin' : 'fa-save'"></i>
          {{ cargando ? ' Procesando...' : ' Guardar Sensor' }}
        </button>
      </div>
    </div>
  </div>
</div>
