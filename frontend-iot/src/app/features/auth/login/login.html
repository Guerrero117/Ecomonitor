<div class="login-screen">
  <div class="login-card">
    <div class="header">
      <h1>🌱 EcoMonitor</h1>
      <p>Gestión inteligente de ecosistemas IoT</p>
    </div>

    <form (ngSubmit)="login()">
      
      <div class="input-group">
        <label for="email">Correo Electrónico</label>
        <input 
          type="email" 
          id="email"
          name="email" 
          [(ngModel)]="email" 
          placeholder="usuario@correo.com" 
          required>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password"
          name="password" 
          [(ngModel)]="password" 
          placeholder="••••••••" 
          required>
      </div>

      <button type="submit" class="btn-enter">
        Iniciar sesión
      </button>

      <button type="button" class="btn-register" (click)="goRegister()">
        Registrate
      </button>
      
      <button type="button" class="btn-forgot" (click)="irARecuperar()">
        ¿Olvidaste tu contraseña?
      </button>

    </form>
  </div>
</div>
